name: Auditar estructura TOC

on:
  push:
    branches: [main]
    paths:
      - "ES/**"
      - "src/SP_SRD_CC_V5.2.1_index.json"
      - "scripts/auditar_estructura_toc.py"
      - ".github/workflows/auditar-toc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auditar-toc-main
  cancel-in-progress: true

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar TOC de referencia ES
        run: >-
          python scripts/auditar_estructura_toc.py
          --indice src/SP_SRD_CC_V5.2.1_index.json
          --es ES
          --salida auditoria-toc-es.json
      - name: Publicar informe
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-estructura-toc
          path: auditoria-toc-es.json
          if-no-files-found: error
