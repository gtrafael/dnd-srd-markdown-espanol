name: Auditar recuadros

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auditar-recuadros.yml"

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Listar notas marcadas como recuadro o callout
        shell: python
        run: |
          from pathlib import Path
          import re
          for lang in ("ES", "EN"):
              for p in sorted(Path(lang).rglob("*.md")):
                  text = p.read_text(encoding="utf-8")
                  if re.search(r"(?im)^tags:\s*\[[^\]]*(?:recuadro|callout)[^\]]*\]", text):
                      title = next((line[2:].strip() for line in text.splitlines() if line.startswith("# ")), "")
                      print(f"{p}\t{title}")
