name: Normalizar custom/main

on:
  workflow_dispatch:
  push:
    branches:
      - custom/main
    paths:
      - scripts/aplicar_correcciones_verificadas.py
      - scripts/normalizar_tablas_semanticas.py
      - scripts/normalizar_estructura_en.py
      - scripts/normalizar_listas_conjuros.py
      - scripts/generar_indices_obsidian.py
      - ".github/workflows/normalizar-custom.yml"

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener custom/main
        uses: actions/checkout@v4
        with:
          ref: custom/main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar correcciones verificadas
        run: python scripts/aplicar_correcciones_verificadas.py

      - name: Normalizar estructura EN según TOC
        run: python scripts/normalizar_estructura_en.py

      - name: Normalizar tablas comprimidas
        run: python scripts/normalizar_tablas_semanticas.py

      - name: Normalizar listas de conjuros y continuaciones
        run: python scripts/normalizar_listas_conjuros.py

      - name: Regenerar índices Obsidian
        run: python scripts/generar_indices_obsidian.py

      - name: Commit de normalización
        shell: bash
        run: |
          git add ES EN
          if git diff --cached --quiet; then
            echo "No hay cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: aplicar normalizaciones verificadas al corpus bilingüe"
          git fetch origin custom/main
          git rebase origin/custom/main
          git push origin HEAD:custom/main
