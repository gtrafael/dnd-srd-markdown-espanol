name: Normalizar custom/main

on:
  workflow_dispatch:
  push:
    branches:
      - custom/main
    paths:
      - scripts/aplicar_correcciones_verificadas.py
      - scripts/normalizar_tablas_semanticas.py

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener custom/main
        uses: actions/checkout@v4
        with:
          ref: custom/main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar correcciones verificadas
        run: python scripts/aplicar_correcciones_verificadas.py

      - name: Normalizar tablas comprimidas
        run: python scripts/normalizar_tablas_semanticas.py

      - name: Commit de normalización
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hay cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ES EN
          git commit -m "fix: aplicar normalizaciones verificadas al corpus bilingüe [skip ci]"
          git push origin HEAD:custom/main
