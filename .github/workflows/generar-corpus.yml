name: Generar custom/corpus

on:
  workflow_dispatch:
  push:
    branches:
      - custom/main
    paths:
      - "ES/**"
      - "EN/**"
      - "scripts/generar_corpus_limpio.py"
      - ".github/workflows/generar-corpus.yml"
      - "docs/FORK.md"

permissions:
  contents: write

concurrency:
  group: generar-custom-corpus
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener custom/main
        uses: actions/checkout@v4
        with:
          ref: custom/main
          fetch-depth: 0

      - name: Crear rama derivada local
        run: git checkout -B custom/corpus

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar variante limpia
        run: python scripts/generar_corpus_limpio.py

      - name: Publicar custom/corpus
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ES EN metadata
          if git diff --cached --quiet; then
            echo "No hay diferencias derivadas."
          else
            git commit -m "build: regenerar corpus limpio desde custom/main"
          fi
          git push --force origin HEAD:custom/corpus
