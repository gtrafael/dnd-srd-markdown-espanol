name: TMP limpiar migración TOC

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-cleanup-toc.yml"

permissions:
  contents: write

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Eliminar rama temporal
        run: git push origin --delete "migration/toc-canonical"
