name: Migrar estructura TOC

on:
  push:
    branches:
      - migration/toc-canonical
    paths:
      - ".github/workflows/migrar-estructura-toc.yml"

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/toc-canonical
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Migrar contenido
        run: python scripts/migrar_estructura_toc.py

      - name: Regenerar índices
        run: python scripts/generar_indices_obsidian.py

      - name: Comprobar sintaxis
        run: |
          python -m py_compile scripts/migrar_estructura_toc.py
          python -m py_compile scripts/generar_indices_obsidian.py
          python -m py_compile scripts/auditar_estructura_toc.py
          python -m py_compile scripts/generar_corpus_limpio.py

      - name: Gates estructurales
        run: |
          python scripts/auditar_estructura_toc.py \
            --indice src/SP_SRD_CC_V5.2.1_index.json \
            --es ES \
            --salida auditoria-toc-es.json
          python scripts/auditar_simetria_es_en.py --salida auditoria-simetria.json
          python scripts/auditar_tablas_semanticas.py \
            --es ES --en EN --salida auditoria-tablas.json

      - name: Publicar migración
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ES EN scripts
          git commit -m "refactor: alinear estructura canónica con el TOC"
          git push origin HEAD:migration/toc-canonical
