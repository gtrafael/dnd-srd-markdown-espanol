name: Experimento wikilinks ES-EN

on:
  push:
    branches:
      - experimento/wikilinks-es
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: experimento/wikilinks-es
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar sintaxis
        run: python -m py_compile scripts/generar_wikilinks.py

      - name: Simular generación bilingüe
        run: python scripts/generar_wikilinks.py --dry-run

      - name: Generar wikilinks ES y EN
        run: python scripts/generar_wikilinks.py

      - name: Validar longest-match y bloqueadores
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          script = Path("scripts/generar_wikilinks.py")
          spec = importlib.util.spec_from_file_location("wikilinks", script)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          def setup(language):
              root = Path(language)
              catalog = module.build_catalog(root, language)
              blockers = module.build_blockers(root, catalog, language)
              matcher = module.compile_matcher(catalog, blockers)
              fake_path = root / "__prueba__.md"

              def links(text):
                  return module.detect_links(
                      fake_path,
                      text,
                      root,
                      catalog,
                      blockers,
                      matcher,
                      language,
                  )

              return links

          es_links = setup("ES")
          only_package = es_links("Un paquete de explorador contiene equipo útil.")
          assert not any("Clases/Explorador" in link for link in only_package), only_package

          both = es_links("El explorador lleva un paquete de explorador.")
          explorer = [link for link in both if "Clases/Explorador" in link]
          assert len(explorer) == 1, both

          en_links = setup("EN")
          mage_armor = en_links("Mage Armor protects the target.")
          assert any("|Mage Armor]]" in link for link in mage_armor), mage_armor
          assert not any("Monsters A-Z/Mage|" in link for link in mage_armor), mage_armor

          print("OK: longest-match y bloqueadores funcionan en ES y EN.")
          PY

      - name: Validar contexto de conjuros de una palabra
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          script = Path("scripts/generar_wikilinks.py")
          spec = importlib.util.spec_from_file_location("wikilinks", script)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          def setup(language):
              root = Path(language)
              catalog = module.build_catalog(root, language)
              blockers = module.build_blockers(root, catalog, language)
              matcher = module.compile_matcher(catalog, blockers)
              fake_path = root / "__prueba_conjuros__.md"

              def links(text):
                  return module.detect_links(
                      fake_path,
                      text,
                      root,
                      catalog,
                      blockers,
                      matcher,
                      language,
                  )

              return links

          es_links = setup("ES")
          assert not any("|Volar]]" in x for x in es_links("El águila puede volar 18 m."))
          assert any("|Volar]]" in x for x in es_links("Puedes lanzar el conjuro volar sobre una criatura."))

          tabla_conjuro = (
              "| Conjuro | Escuela |\n"
              "|---|---|\n"
              "| Adivinación | Adivinación |\n"
          )
          tabla_escuela = (
              "| Nombre | Escuela |\n"
              "| Detectar magia | Adivinación |\n"
          )
          assert any("|Adivinación]]" in x for x in es_links(tabla_conjuro))
          assert not any("|Adivinación]]" in x for x in es_links(tabla_escuela))

          tabla_maestria = (
              "| Arma | Maestría |\n"
              "| Garrote | Ralentizar |\n"
          )
          assert not any("|Ralentizar]]" in x for x in es_links(tabla_maestria))

          en_links = setup("EN")
          assert not any("|Fly]]" in x for x in en_links("The eagle can fly 60 feet."))
          assert any("|Fly]]" in x for x in en_links("You can cast the Fly spell on a creature."))

          spell_table = (
              "| Spell | School |\n"
              "|---|---|\n"
              "| Divination | Divination |\n"
          )
          school_table = (
              "| Name | School |\n"
              "| Detect Magic | Divination |\n"
          )
          assert any("|Divination]]" in x for x in en_links(spell_table))
          assert not any("|Divination]]" in x for x in en_links(school_table))

          mastery_table = (
              "| Weapon | Mastery |\n"
              "| Club | Slow |\n"
          )
          assert not any("|Slow]]" in x for x in en_links(mastery_table))

          print("OK: los conjuros/spells de una palabra exigen contexto en ES y EN.")
          PY

      - name: Validar simetría de objetos mágicos
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          script = Path("scripts/generar_wikilinks.py")
          spec = importlib.util.spec_from_file_location("wikilinks", script)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          checks = {
              "ES": Path("ES/ObjetosMagicos/ObjetosMagicosDeLaAALaZ"),
              "EN": Path("EN/Magic Items/Magic Items A-Z"),
          }

          for language, folder in checks.items():
              catalog = module.build_catalog(Path(language), language)
              detected = sum(
                  1
                  for concepts in catalog.values()
                  for concept in concepts
                  if concept.kind == "magic_item"
              )
              physical = sum(
                  1
                  for path in folder.rglob("*.md")
                  if not module.is_index(path.relative_to(Path(language)))
                  and not module.is_alt_path(path.relative_to(Path(language)))
              )
              assert detected == physical, (
                  language,
                  detected,
                  physical,
              )

          print("OK: todos los objetos mágicos físicos se detectan en ES y EN.")
          PY

      - name: Validar enlaces conjuro-clase
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def frontmatter(path):
              text = Path(path).read_text(encoding="utf-8")
              match = re.match(r"^---\r?\n([\s\S]*?)\r?\n---", text)
              assert match, path
              return match.group(1)

          es = frontmatter("ES/Conjuros/DescripcionesDeConjuros/BolaDeFuego.md")
          assert "[[Clases/Hechicero|Hechicero]]" in es
          assert "[[Clases/Mago|Mago]]" in es

          en = frontmatter("EN/Spells/Spell Descriptions/Fireball.md")
          assert "[[Classes/Sorcerer|Sorcerer]]" in en
          assert "[[Classes/Wizard|Wizard]]" in en

          print("OK: los conjuros enlazan a sus clases declaradas en ES y EN.")
          PY

      - name: Validar invariantes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          forbidden = [Path("ES/_Entidades"), Path("EN/_Entities")]
          existing = [path for path in forbidden if path.exists()]
          if existing:
              print("ERROR: no se permiten carpetas de entidades auxiliares:")
              for path in existing:
                  print("  -", path)
              sys.exit(1)

          def strip_frontmatter(text: str) -> str:
              if not text.startswith("---"):
                  return text

              lines = text.splitlines(keepends=True)
              for index in range(1, len(lines)):
                  if lines[index].strip() == "---":
                      return "".join(lines[index + 1:])

              return text

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--", "ES", "EN"],
              text=True,
          ).splitlines()

          body_errors = []

          for name in changed:
              path = Path(name)
              if not path.exists() or path.suffix != ".md":
                  continue

              before = subprocess.run(
                  ["git", "show", f"HEAD:{name}"],
                  text=True,
                  capture_output=True,
              )

              if before.returncode != 0:
                  continue

              after = path.read_text(encoding="utf-8")

              if strip_frontmatter(before.stdout) != strip_frontmatter(after):
                  body_errors.append(name)

          if body_errors:
              print("ERROR: se modificó el cuerpo Markdown:")
              for name in body_errors:
                  print("  -", name)
              sys.exit(1)

          print(f"OK: {len(changed)} archivos cambian únicamente en frontmatter.")
          PY

      - name: Validar idempotencia
        shell: bash
        run: |
          git diff -- ES EN > /tmp/antes.diff
          python scripts/generar_wikilinks.py
          git diff -- ES EN > /tmp/despues.diff
          cmp /tmp/antes.diff /tmp/despues.diff

      - name: Guardar resultado
        shell: bash
        run: |
          if git diff --quiet -- ES EN; then
            echo "No hay cambios que guardar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ES EN
          git commit -m "experimento: regenerar wikilinks ES-EN"
          git push
