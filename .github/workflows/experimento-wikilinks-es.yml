name: Experimento wikilinks ES

on:
  push:
    branches:
      - experimento/wikilinks-es
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: experimento/wikilinks-es
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar sintaxis
        run: python -m py_compile scripts/generar_wikilinks_es.py

      - name: Simular generación
        run: python scripts/generar_wikilinks_es.py --dry-run

      - name: Generar wikilinks v2
        run: python scripts/generar_wikilinks_es.py

      - name: Validar invariantes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          GENERATED = Path("ES/_Entidades")
          FORBIDDEN = (
              "[[Equipo/Armas|",
              "[[Equipo/Armaduras|",
              "[[Equipo/EquipoDeAventureros|",
              "[[Equipo/Herramientas|",
              "[[Conjuros/Conjuros|",
              "[[Dotes/Dotes",
              "[[Clases/Clases-Index|",
          )

          def strip_frontmatter(text: str) -> str:
              if not text.startswith("---"):
                  return text
              lines = text.splitlines(keepends=True)
              for i in range(1, len(lines)):
                  if lines[i].strip() == "---":
                      return "".join(lines[i + 1:])
              return text

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--", "ES"],
              text=True,
          ).splitlines()

          body_errors = []
          forbidden_errors = []

          for name in changed:
              path = Path(name)
              if path.suffix != ".md":
                  continue

              # git diff también lista archivos eliminados. Si el generador ha
              # retirado un nodo obsoleto, no hay contenido actual que validar.
              if not path.exists():
                  continue

              text = path.read_text(encoding="utf-8")

              if not path.is_relative_to(GENERATED):
                  before = subprocess.run(
                      ["git", "show", f"HEAD:{name}"],
                      text=True,
                      capture_output=True,
                  )
                  if before.returncode == 0 and strip_frontmatter(before.stdout) != strip_frontmatter(text):
                      body_errors.append(name)

              for token in FORBIDDEN:
                  if token in text:
                      forbidden_errors.append((name, token))

          if body_errors:
              print("ERROR: se modificó el cuerpo Markdown:")
              for name in body_errors:
                  print("  -", name)
              sys.exit(1)

          if forbidden_errors:
              print("ERROR: quedan destinos contenedores prohibidos:")
              for name, token in forbidden_errors:
                  print(f"  - {name}: {token}")
              sys.exit(1)

          print(f"OK: {len(changed)} archivos cambian respetando los invariantes v2.")
          PY

      - name: Guardar resultado
        shell: bash
        run: |
          if git diff --quiet -- ES; then
            echo "No hay cambios que guardar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ES
          git commit -m "experimento: regenerar wikilinks ES v2"
          git push
