name: Experimento wikilinks ES

on:
  push:
    branches:
      - experimento/wikilinks-es
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: experimento/wikilinks-es
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar sintaxis
        run: python -m py_compile scripts/generar_wikilinks_es.py

      - name: Simular generación
        run: python scripts/generar_wikilinks_es.py --dry-run

      - name: Generar wikilinks v3
        run: python scripts/generar_wikilinks_es.py

      - name: Validar longest-match y bloqueadores
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          script = Path("scripts/generar_wikilinks_es.py")
          spec = importlib.util.spec_from_file_location("wikilinks_es", script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          es = Path("ES")
          catalog = module.build_catalog(es)
          blockers = module.build_blockers(es, catalog)
          matcher = module.compile_matcher(catalog, blockers)

          fake_path = es / "__prueba__.md"

          def links(text):
              return module.detect_links(
                  fake_path,
                  text,
                  es,
                  catalog,
                  blockers,
                  matcher,
              )

          only_package = links("Un paquete de explorador contiene equipo útil.")
          assert not any("Clases/Explorador" in link for link in only_package), only_package

          both = links("El explorador lleva un paquete de explorador.")
          explorer = [link for link in both if "Clases/Explorador" in link]
          assert len(explorer) == 1, both

          print("OK: longest-match conserva Explorador independiente y bloquea el interior de Paquete de explorador.")
          PY

      - name: Validar invariantes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          if Path("ES/_Entidades").exists():
              print("ERROR: v3 no permite ES/_Entidades.")
              sys.exit(1)

          def strip_frontmatter(text: str) -> str:
              if not text.startswith("---"):
                  return text

              lines = text.splitlines(keepends=True)
              for index in range(1, len(lines)):
                  if lines[index].strip() == "---":
                      return "".join(lines[index + 1:])

              return text

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--", "ES"],
              text=True,
          ).splitlines()

          body_errors = []

          for name in changed:
              path = Path(name)
              if not path.exists() or path.suffix != ".md":
                  continue

              before = subprocess.run(
                  ["git", "show", f"HEAD:{name}"],
                  text=True,
                  capture_output=True,
              )

              if before.returncode != 0:
                  continue

              after = path.read_text(encoding="utf-8")

              if strip_frontmatter(before.stdout) != strip_frontmatter(after):
                  body_errors.append(name)

          if body_errors:
              print("ERROR: se modificó el cuerpo Markdown:")
              for name in body_errors:
                  print("  -", name)
              sys.exit(1)

          print(f"OK: {len(changed)} archivos cambian únicamente en frontmatter.")
          PY

      - name: Validar idempotencia
        shell: bash
        run: |
          git diff -- ES > /tmp/antes.diff
          python scripts/generar_wikilinks_es.py
          git diff -- ES > /tmp/despues.diff
          cmp /tmp/antes.diff /tmp/despues.diff

      - name: Guardar resultado
        shell: bash
        run: |
          if git diff --quiet -- ES; then
            echo "No hay cambios que guardar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ES
          git commit -m "experimento: regenerar wikilinks ES v3"
          git push
